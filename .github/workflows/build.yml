name: Build libKeyAuth

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd API
          make clean 2>/dev/null || true
          make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KeyAuth-iOS
          path: API/libKeyAuth.a
